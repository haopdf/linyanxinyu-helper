<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文章详情 - 林燕心语</title>
  <meta name="description" content="林燕心语 - 杭州一线初中教师林燕的育儿心得分享，专注青春期心理与家庭教育。" />
  <meta name="keywords" content="青春期心理,亲子沟通,家庭教育,学习动力,情绪管理,林燕心语" />
  <meta property="og:title" content="林燕心语 - 青春期心理与家庭教育" />
  <meta property="og:description" content="杭州一线初中教师林燕的育儿心得分享" />
  <meta property="og:type" content="article" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      padding-bottom: 80px;
      min-height: auto;
    }
    /* 阅读进度条 */
    .reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, #f97316, #ec4899);
      z-index: 1000;
      transition: width 0.1s ease;
      width: 0%;
    }

    .article-detail {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    /* 文章封面图 */
    .article-cover {
      width: 100%;
      height: 200px;
      border-radius: 12px;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #f97316 0%, #fb923c 50%, #ec4899 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .article-cover::before {
      content: '';
      position: absolute;
      width: 200px;
      height: 200px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      top: -50px;
      right: -50px;
    }
    .article-cover::after {
      content: '';
      position: absolute;
      width: 150px;
      height: 150px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
      bottom: -30px;
      left: -30px;
    }
    .article-cover .cover-icon {
      font-size: 60px;
      z-index: 1;
    }
    .article-cover .cover-category {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      z-index: 1;
    }

    .article-header {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .article-header h1 {
      font-size: 22px;
      line-height: 1.4;
      color: var(--text-primary);
      margin: 0 0 12px 0;
      font-weight: 700;
    }
    .article-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 13px;
      color: var(--text-muted);
      align-items: center;
    }
    .article-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .article-content {
      font-size: 16px;
      line-height: 1.8;
      color: var(--text-secondary);
    }
    .article-content p {
      margin: 0 0 16px 0;
    }
    .article-content h3 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 28px 0 12px 0;
      padding-left: 10px;
      border-left: 4px solid var(--primary);
    }
    .article-content strong {
      color: var(--primary);
      font-weight: 600;
    }
    .article-content blockquote {
      margin: 16px 0;
      padding: 12px 16px;
      background: var(--bg-card);
      border-left: 4px solid var(--primary);
      border-radius: 0 8px 8px 0;
      color: var(--text-secondary);
      font-size: 15px;
    }

    .article-tags {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .article-tags .tag {
      background: var(--bg-card);
      color: var(--text-muted);
      padding: 4px 12px;
      border-radius: 14px;
      font-size: 12px;
    }

    /* 点赞和互动区 */
    .article-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      padding: 20px 16px;
      background: var(--bg-card);
      border-radius: var(--radius);
      align-items: center;
    }
    .like-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border: none;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      background: linear-gradient(135deg, #f97316, #ec4899);
      color: #fff;
    }
    .like-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
    }
    .like-btn.liked {
      background: linear-gradient(135deg, #ec4899, #f97316);
    }
    .like-btn .like-icon {
      font-size: 18px;
      transition: transform 0.3s ease;
    }
    .like-btn.liked .like-icon {
      animation: heartBeat 0.6s ease;
    }
    @keyframes heartBeat {
      0% { transform: scale(1); }
      25% { transform: scale(1.3); }
      50% { transform: scale(0.9); }
      75% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    .action-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
      background: var(--bg);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .action-btn:hover {
      opacity: 0.85;
    }

    /* 相关文章 */
    .related-articles {
      margin-top: 32px;
    }
    .related-articles h3 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0 0 16px 0;
    }
    .related-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .related-item {
      display: block;
      padding: 14px 16px;
      background: var(--bg-card);
      border-radius: var(--radius);
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .related-item:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    .related-item .title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0 0 6px 0;
      line-height: 1.4;
    }
    .related-item .meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      cursor: pointer;
    }
    .back-btn:hover {
      text-decoration: underline;
    }

    .loading, .error {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 15px;
    }
    .loading .icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    /* 返回顶部按钮 */
    .back-to-top {
      position: fixed;
      bottom: 30px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f97316, #ec4899);
      color: #fff;
      border: none;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .back-to-top.visible {
      opacity: 1;
      visibility: visible;
    }
    .back-to-top:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(249, 115, 22, 0.4);
    }

    .share-tip {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      color: #fff;
      padding: 20px 30px;
      border-radius: 12px;
      font-size: 14px;
      z-index: 1000;
      text-align: center;
    }
    .share-tip .arrow {
      font-size: 30px;
      margin-bottom: 8px;
    }

    /* 留言弹窗 */
    .message-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .message-modal-overlay.active {
      display: flex;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .message-modal {
      background: var(--bg-card);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .message-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, #f97316, #ec4899);
      border-radius: 16px 16px 0 0;
      color: #fff;
    }
    .message-modal-header h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .message-modal-close {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .message-modal-close:hover {
      background: rgba(255,255,255,0.3);
    }
    .message-modal-body {
      padding: 24px;
    }
    .message-modal-form .form-group {
      margin-bottom: 16px;
    }
    .message-modal-form label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .message-modal-form input,
    .message-modal-form textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      background: var(--bg);
      color: var(--text-primary);
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .message-modal-form input:focus,
    .message-modal-form textarea:focus {
      outline: none;
      border-color: var(--primary);
    }
    .message-modal-form textarea {
      resize: vertical;
      min-height: 100px;
    }
    .message-modal-form .char-count {
      text-align: right;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .message-modal-submit {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #f97316, #ec4899);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
    }
    .message-modal-submit:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .message-modal-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .message-modal-tip {
      margin-top: 16px;
      padding: 12px;
      background: var(--bg);
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .message-modal-tip strong {
      color: var(--primary);
    }

    /* 页脚链接样式 */
    footer a {
      color: var(--primary);
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.2s;
    }
    footer a:hover {
      background: var(--primary);
      color: #fff;
      text-decoration: none;
    }

    /* 搜索建议下拉列表 */
    .search-suggestions {
      position: absolute;
      top: 100%;
      left: 8px;
      right: 8px;
      background: var(--bg-card);
      border-radius: 0 0 12px 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      z-index: 1000;
      display: none;
      overflow: hidden;
      margin-top: 4px;
    }
    .search-suggestions.active {
      display: block;
    }
    .search-suggestion-item {
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.15s;
      border-bottom: 1px solid var(--border);
    }
    .search-suggestion-item:last-child {
      border-bottom: none;
    }
    .search-suggestion-item:hover,
    .search-suggestion-item.active {
      background: var(--bg);
    }
    .search-suggestion-item .icon {
      font-size: 14px;
      flex-shrink: 0;
    }
    .search-suggestion-item .text {
      flex: 1;
      font-size: 14px;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .search-suggestion-item .text mark {
      background: rgba(249, 115, 22, 0.2);
      color: var(--primary);
      padding: 0 2px;
      border-radius: 2px;
    }
    .search-suggestion-item .type {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg);
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .search-suggestions .empty {
      padding: 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }
    .search-wrapper {
      position: relative;
      flex: 1;
    }
    .search-box .search-clear {
      font-size: 18px;
      color: rgba(255,255,255,0.8);
      cursor: pointer;
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      transition: all 0.2s;
      line-height: 1;
    }
    .search-box .search-clear:hover {
      background: rgba(255,255,255,0.35);
      color: #fff;
    }
  </style>
</head>
<body>
  <!-- 阅读进度条 -->
  <div class="reading-progress" id="readingProgress"></div>

  <header class="topbar">
    <a href="index.html" class="topbar-logo">🌸 林燕心语</a>
    <div class="search-wrapper">
      <div class="search-box" style="flex:1;">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索文章、关键词..." autocomplete="off" />
        <span class="search-clear" id="searchClear" style="display:none;">×</span>
      </div>
      <div class="search-suggestions" id="searchSuggestions"></div>
    </div>
  </header>

  <div class="article-detail" id="articleDetail">
    <div class="loading">
      <div class="icon">⏳</div>
      <p>文章加载中...</p>
    </div>
  </div>

  <!-- 返回顶部按钮 -->
  <button class="back-to-top" id="backToTop" onclick="scrollToTop()" title="返回顶部">↑</button>

  <div class="share-tip" id="shareTip">
    <div class="arrow">↗️</div>
    <p>点击右上角「...」<br/>分享给朋友或朋友圈</p>
  </div>

  <footer>
    <p>🌸 林燕心语 · 青春期心理与家庭教育</p>
    <p>杭州一线初中教师林燕的育儿心得分享</p>
    <p>公众号：林燕心语 | 商务合作：linyanxinyu@163.com</p>
    <p style="margin-top:8px;">
      <a href="articles.html">文章合集</a> · 
      <a href="#" onclick="openMessageModal(); return false;">💬 联系我们/留言</a>
    </p>
    <p style="margin-top:12px;color:var(--text-muted);">© 2026 林燕心语 版权所有</p>
  </footer>

  <script>
    // 获取 URL 参数中的文章 ID
    const urlParams = new URLSearchParams(window.location.search);
    const articleId = urlParams.get('id');

    // 分类名称映射
    const categoryNames = {
      communication: '亲子沟通',
      adolescence: '青春期',
      learning: '学习动力',
      emotion: '情绪管理',
      digital: '手机沉迷',
      family: '家庭教育',
      special: '特殊问题',
      growth: '心理成长'
    };

    // 分类图标映射
    const categoryIcons = {
      communication: '💬',
      adolescence: '🌱',
      learning: '📚',
      emotion: '😊',
      digital: '📱',
      family: '🏠',
      special: '⚠️',
      growth: '🌳'
    };

    // 当前文章数据
    let currentArticle = null;

    // 加载文章
    async function loadArticle() {
      const container = document.getElementById('articleDetail');

      if (!articleId) {
        container.innerHTML = '<div class="error"><div class="icon">❌</div><p>未指定文章</p><a href="articles.html" class="back-btn">← 返回文章列表</a></div>';
        return;
      }

      try {
        const res = await fetch('data/articles.json');
        const data = await res.json();
        const article = data.articles.find(a => a.id === articleId);

        if (!article) {
          container.innerHTML = '<div class="error"><div class="icon">❌</div><p>文章不存在</p><a href="articles.html" class="back-btn">← 返回文章列表</a></div>';
          return;
        }

        currentArticle = article;

        // 更新页面标题和 SEO
        document.title = article.title + ' - 林燕心语';
        document.querySelector('meta[name="description"]').content = article.excerpt;
        document.querySelector('meta[property="og:title"]').content = article.title;
        document.querySelector('meta[property="og:description"]').content = article.excerpt;

        // 相关文章（同分类的其他文章）
        const related = data.articles
          .filter(a => a.category === article.category && a.id !== article.id)
          .slice(0, 3);

        // 检查是否已点赞
        const liked = localStorage.getItem('liked_' + articleId) === 'true';

        // 渲染文章
        container.innerHTML = `
          <a href="javascript:history.back()" class="back-btn">← 返回</a>

          <!-- 文章封面图 -->
          <div class="article-cover">
            <span class="cover-category">${categoryIcons[article.category] || '📝'} ${article.categoryName || categoryNames[article.category] || ''}</span>
            <span class="cover-icon">${categoryIcons[article.category] || '📝'}</span>
          </div>

          <div class="article-header">
            <h1>${escapeHtml(article.title)}</h1>
            <div class="article-meta">
              <span>📅 ${article.date}</span>
              <span>⏱️ ${article.readTime}</span>
              <span>👁️ <span id="viewCount">${article.views}</span> 阅读</span>
            </div>
          </div>

          <div class="article-content">
            ${article.content}
          </div>

          <div class="article-tags">
            ${(article.tags || []).map(tag => `<span class="tag">#${escapeHtml(tag)}</span>`).join('')}
          </div>

          <!-- 点赞和互动区 -->
          <div class="article-actions">
            <button class="like-btn ${liked ? 'liked' : ''}" id="likeBtn" onclick="toggleLike()">
              <span class="like-icon">${liked ? '❤️' : '🤍'}</span>
              <span id="likeCount">${liked ? '已点赞' : '点赞'}</span>
            </button>
            <button class="action-btn" onclick="shareArticle()">📤 分享</button>
            <button class="action-btn" onclick="window.location.href='articles.html'">📚 更多</button>
          </div>

          ${related.length > 0 ? `
          <div class="related-articles">
            <h3>📖 相关文章</h3>
            <div class="related-list">
              ${related.map(a => `
                <a href="article.html?id=${a.id}" class="related-item">
                  <p class="title">${escapeHtml(a.title)}</p>
                  <p class="meta">${a.date} · ${a.readTime} · ${a.views} 阅读</p>
                </a>
              `).join('')}
            </div>
          </div>
          ` : ''}
        `;

        // 增加阅读量
        incrementView();
        // 获取点赞数
        loadLikeCount();

      } catch (e) {
        console.error('加载文章失败:', e);
        container.innerHTML = '<div class="error"><div class="icon">❌</div><p>文章加载失败，请稍后再试</p><a href="articles.html" class="back-btn">← 返回文章列表</a></div>';
      }
    }

    // HTML 转义
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 增加阅读量
    async function incrementView() {
      try {
        const res = await fetch('api/view?id=' + articleId, { method: 'POST' });
        const data = await res.json();
        if (data.views) {
          document.getElementById('viewCount').textContent = data.views;
        }
      } catch (e) {
        console.log('阅读量统计失败:', e);
      }
    }

    // 加载点赞数
    async function loadLikeCount() {
      try {
        const res = await fetch('api/like?id=' + articleId);
        const data = await res.json();
        const liked = localStorage.getItem('liked_' + articleId) === 'true';
        const likeBtn = document.getElementById('likeBtn');
        const likeCount = document.getElementById('likeCount');
        if (liked) {
          likeCount.textContent = '已点赞 ' + (data.likes || '');
        } else {
          likeCount.textContent = '点赞 ' + (data.likes || '');
        }
      } catch (e) {
        console.log('加载点赞数失败:', e);
      }
    }

    // 切换点赞
    async function toggleLike() {
      const liked = localStorage.getItem('liked_' + articleId) === 'true';
      const likeBtn = document.getElementById('likeBtn');
      const likeCount = document.getElementById('likeCount');
      const likeIcon = likeBtn.querySelector('.like-icon');

      if (liked) {
        // 取消点赞（前端只取消本地状态，不调用 API 减少）
        localStorage.removeItem('liked_' + articleId);
        likeBtn.classList.remove('liked');
        likeIcon.textContent = '🤍';
        likeCount.textContent = '点赞';
        loadLikeCount();
      } else {
        // 点赞
        localStorage.setItem('liked_' + articleId, 'true');
        likeBtn.classList.add('liked');
        likeIcon.textContent = '❤️';

        try {
          const res = await fetch('api/like?id=' + articleId, { method: 'POST' });
          const data = await res.json();
          likeCount.textContent = '已点赞 ' + (data.likes || '');
        } catch (e) {
          likeCount.textContent = '已点赞';
        }
      }
    }

    // 分享文章
    function shareArticle() {
      const tip = document.getElementById('shareTip');
      tip.style.display = 'block';
      setTimeout(() => { tip.style.display = 'none'; }, 3000);
    }

    // 阅读进度条
    function updateReadingProgress() {
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
      document.getElementById('readingProgress').style.width = progress + '%';
    }

    // 返回顶部按钮显示/隐藏
    function toggleBackToTop() {
      const btn = document.getElementById('backToTop');
      if (window.scrollY > 300) {
        btn.classList.add('visible');
      } else {
        btn.classList.remove('visible');
      }
    }

    // 滚动到顶部
    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 监听滚动事件
    window.addEventListener('scroll', () => {
      updateReadingProgress();
      toggleBackToTop();
    });

    // 页面加载时获取文章
    loadArticle();

    // 留言弹窗
    const messageModalOverlay = document.createElement('div');
    messageModalOverlay.className = 'message-modal-overlay';
    messageModalOverlay.id = 'messageModalOverlay';
    messageModalOverlay.innerHTML = `
      <div class="message-modal">
        <div class="message-modal-header">
          <h3>💬 我要留言</h3>
          <button class="message-modal-close" onclick="closeMessageModal()">×</button>
        </div>
        <div class="message-modal-body">
          <form class="message-modal-form" id="messageModalForm" onsubmit="submitModalMessage(event)">
            <div class="form-group">
              <label for="modalMsgName">昵称（选填）</label>
              <input type="text" id="modalMsgName" placeholder="匿名家长" maxlength="20" />
            </div>
            <div class="form-group">
              <label for="modalMsgContent">留言内容 <span style="color:#ef4444;">*</span></label>
              <textarea id="modalMsgContent" placeholder="分享你的育儿困惑、经验或建议..." maxlength="500" required></textarea>
              <div class="char-count"><span id="modalCharCount">0</span>/500</div>
            </div>
            <button type="submit" class="message-modal-submit" id="modalSubmitBtn">提交留言</button>
          </form>
          <div class="message-modal-tip">
            <strong>💡 温馨提示：</strong>你的留言会显示在首页下方的留言板中。林燕老师会认真阅读每一条留言，选择有代表性的问题在后续文章中解答。
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(messageModalOverlay);

    // 打开留言弹窗
    function openMessageModal() {
      document.getElementById('messageModalOverlay').classList.add('active');
      document.body.style.overflow = 'hidden';
      setTimeout(() => {
        document.getElementById('modalMsgContent').focus();
      }, 300);
    }

    // 关闭留言弹窗
    function closeMessageModal() {
      document.getElementById('messageModalOverlay').classList.remove('active');
      document.body.style.overflow = '';
    }

    // 点击遮罩关闭弹窗
    messageModalOverlay.addEventListener('click', function(e) {
      if (e.target === messageModalOverlay) {
        closeMessageModal();
      }
    });

    // ESC 键关闭弹窗
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && messageModalOverlay.classList.contains('active')) {
        closeMessageModal();
      }
    });

    // 字数统计
    const modalMsgContent = document.getElementById('modalMsgContent');
    const modalCharCount = document.getElementById('modalCharCount');
    modalMsgContent.addEventListener('input', function() {
      modalCharCount.textContent = this.value.length;
    });

    // 提交弹窗留言
    async function submitModalMessage(e) {
      e.preventDefault();
      const name = document.getElementById('modalMsgName').value.trim() || '匿名家长';
      const content = document.getElementById('modalMsgContent').value.trim();
      const submitBtn = document.getElementById('modalSubmitBtn');

      if (!content) {
        alert('请输入留言内容');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '提交中...';

      try {
        const res = await fetch('api/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, content })
        });
        const data = await res.json();

        if (data.success) {
          alert('留言提交成功！感谢你的分享 💝');
          closeMessageModal();
          document.getElementById('messageModalForm').reset();
          modalCharCount.textContent = '0';
        } else {
          alert(data.error || '留言提交失败，请稍后再试');
        }
      } catch (err) {
        alert('网络错误，请稍后再试');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '提交留言';
      }
    }

    // 搜索建议功能
    const searchInput = document.getElementById('searchInput');
    const hotKeywords = ['青春期', '厌学', '亲子沟通', '手机沉迷', '学习动力', '情绪管理', '叛逆', '考试焦虑', '自卑', '早恋', '家庭教育', '父母关系', '校园欺凌', '抑郁', '高情商', '自我成长'];
    let activeSuggestionIndex = -1;

    // 文章标题列表（从文章数据中获取）
    let articleTitles = [];
    async function loadArticleTitles() {
      try {
        const res = await fetch('data/articles.json');
        const data = await res.json();
        articleTitles = data.articles.map(a => ({ title: a.title, category: a.category }));
      } catch (e) {
        articleTitles = [];
      }
    }
    loadArticleTitles();

    // 显示搜索建议
    function showSearchSuggestions(query) {
      const suggestionsEl = document.getElementById('searchSuggestions');
      if (!query) {
        suggestionsEl.classList.remove('active');
        suggestionsEl.innerHTML = '';
        activeSuggestionIndex = -1;
        return;
      }

      const queryLower = query.toLowerCase();
      const suggestions = [];

      // 匹配热门关键词
      hotKeywords.forEach(kw => {
        if (kw.toLowerCase().includes(queryLower)) {
          suggestions.push({ type: '关键词', text: kw, icon: '🔥' });
        }
      });

      // 匹配文章标题
      articleTitles.forEach(article => {
        if (article.title.toLowerCase().includes(queryLower)) {
          suggestions.push({ type: categoryNames[article.category] || '文章', text: article.title, icon: '📄' });
        }
      });

      // 去重并限制数量
      const uniqueSuggestions = [];
      const seen = new Set();
      suggestions.forEach(s => {
        if (!seen.has(s.text)) {
          seen.add(s.text);
          uniqueSuggestions.push(s);
        }
      });
      const limitedSuggestions = uniqueSuggestions.slice(0, 8);

      if (limitedSuggestions.length === 0) {
        suggestionsEl.innerHTML = '<div class="empty">没有找到相关建议，按回车搜索</div>';
      } else {
        suggestionsEl.innerHTML = limitedSuggestions.map((s, i) => `
          <div class="search-suggestion-item" data-index="${i}" data-text="${s.text}">
            <span class="icon">${s.icon}</span>
            <span class="text">${highlightMatch(s.text, query)}</span>
            <span class="type">${s.type}</span>
          </div>
        `).join('');

        // 绑定点击事件
        suggestionsEl.querySelectorAll('.search-suggestion-item').forEach(item => {
          item.addEventListener('click', () => {
            const text = item.dataset.text;
            searchInput.value = text;
            window.location.href = `articles.html?search=${encodeURIComponent(text)}`;
          });
        });
      }

      suggestionsEl.classList.add('active');
      activeSuggestionIndex = -1;
    }

    // 高亮匹配文字
    function highlightMatch(text, query) {
      const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return text.replace(regex, '<mark>$1</mark>');
    }

    // 隐藏搜索建议
    function hideSearchSuggestions() {
      const suggestionsEl = document.getElementById('searchSuggestions');
      if (suggestionsEl) {
        suggestionsEl.classList.remove('active');
      }
      activeSuggestionIndex = -1;
    }

    // 搜索输入事件
    searchInput.addEventListener('input', (e) => {
      const value = e.target.value.trim();
      showSearchSuggestions(value);
      // 显示/隐藏清除按钮
      const clearBtn = document.getElementById('searchClear');
      if (clearBtn) {
        clearBtn.style.display = value ? 'flex' : 'none';
      }
    });

    // 清除按钮点击事件
    const searchClearBtn = document.getElementById('searchClear');
    if (searchClearBtn) {
      searchClearBtn.addEventListener('click', () => {
        searchInput.value = '';
        hideSearchSuggestions();
        searchClearBtn.style.display = 'none';
        searchInput.focus();
      });
    }

    // 键盘导航
    searchInput.addEventListener('keydown', (e) => {
      const suggestionsEl = document.getElementById('searchSuggestions');
      const items = suggestionsEl.querySelectorAll('.search-suggestion-item');

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (items.length > 0) {
          activeSuggestionIndex = (activeSuggestionIndex + 1) % items.length;
          updateActiveSuggestion(items);
        }
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (items.length > 0) {
          activeSuggestionIndex = activeSuggestionIndex <= 0 ? items.length - 1 : activeSuggestionIndex - 1;
          updateActiveSuggestion(items);
        }
      } else if (e.key === 'Enter') {
        if (activeSuggestionIndex >= 0 && items[activeSuggestionIndex]) {
          e.preventDefault();
          items[activeSuggestionIndex].click();
        } else {
          const text = searchInput.value.trim();
          if (text) {
            window.location.href = `articles.html?search=${encodeURIComponent(text)}`;
          }
        }
      } else if (e.key === 'Escape') {
        hideSearchSuggestions();
      }
    });

    function updateActiveSuggestion(items) {
      items.forEach((item, i) => {
        if (i === activeSuggestionIndex) {
          item.classList.add('active');
          searchInput.value = item.dataset.text;
        } else {
          item.classList.remove('active');
        }
      });
    }

    // 点击页面其他地方隐藏搜索建议
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-wrapper')) {
        hideSearchSuggestions();
      }
    });

    // 搜索框获得焦点时显示建议（如果有内容）
    searchInput.addEventListener('focus', () => {
      if (searchInput.value.trim()) {
        showSearchSuggestions(searchInput.value.trim());
      }
    });
  </script>
</body>
</html>
